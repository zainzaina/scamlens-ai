<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Analyzer — ScamLens AI</title>
  <meta name="description" content="Paste a suspicious message, screenshot or URL and get an instant AI risk analysis." />
  <meta name="theme-color" content="#20C4C8" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">
  <div id="site-header"></div>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="mb-6">
      <div class="console-label mb-2">Secure intake / analysis console</div>
      <h1 class="text-3xl md:text-4xl font-bold">AI Analyzer</h1>
      <p class="text-sm mt-1" style="color:var(--muted)">Choose an input method — text, screenshot or URL.</p>
    </div>

    <div class="card p-6 md:p-8">
      <div class="flex flex-wrap gap-2 mb-4">
        <button data-tab="text" class="tab active">Paste Text</button>
        <button data-tab="image" class="tab">Upload Screenshot</button>
        <button data-tab="url" class="tab">Paste URL</button>
      </div>

      <div data-panel="text">
        <textarea id="in-text" rows="8" placeholder="Paste the suspicious message, SMS or email here..."></textarea>
      </div>
      <div data-panel="image" class="hidden">
        <label id="drop-zone" for="in-file" class="flex flex-col items-center justify-center gap-2 p-8 rounded-xl border-2 border-dashed cursor-pointer transition" style="border-color: var(--border); background: var(--card-2)">
          <div class="text-sm">Drop screenshot here or <span class="link">browse</span></div>
          <div class="text-xs" style="color:var(--muted)">PNG, JPG · OCR runs locally in the browser (English + Arabic)</div>
          <input id="in-file" type="file" accept="image/*" class="hidden"/>
        </label>
        <div id="file-preview" class="mt-4 text-center"></div>
        <div id="ocr-preview" class="mt-4 hidden">
          <details class="card p-4">
            <summary class="cursor-pointer flex items-center justify-between gap-2">
              <span class="font-semibold">Extracted text preview</span>
              <span id="ocr-status" class="text-xs" style="color:var(--muted)">OCR ready</span>
            </summary>
            <div class="mt-3 space-y-2">
              <div id="ocr-text" class="whitespace-pre-wrap text-sm rounded-lg p-3" style="background: rgba(255,255,255,.03); border:1px solid var(--border)"></div>
              <div id="ocr-meta" class="text-xs" style="color:var(--muted)"></div>
            </div>
          </details>
        </div>
      </div>
      <div data-panel="url" class="hidden">
        <input id="in-url" type="url" placeholder="https://suspicious-link.example/verify" />
      </div>

      <div class="mt-5 flex flex-wrap gap-2 justify-end">
        <button id="btn-demo" class="btn btn-ghost">Load Demo</button>
        <button id="btn-analyze" class="btn btn-primary">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path d="M11.983 1.907a.75.75 0 0 0-1.292-.657l-8.5 9.5A.75.75 0 0 0 2.75 12h6.572l-1.305 6.093a.75.75 0 0 0 1.292.657l8.5-9.5A.75.75 0 0 0 17.25 8h-6.572l1.305-6.093Z"/></svg>
          Analyze
        </button>
      </div>
    </div>

    <div id="result" class="mt-8"></div>
  </main>

  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/report.js"></script>
  <script src="js/analyzer.js"></script>
</body>
</html>
