<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>History — ScamLens AI</title>
  <meta name="description" content="Review, search and export your previous scam analyses." />
  <meta name="theme-color" content="#3B82F6" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="logo.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="logo.svg" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen">
  <div id="site-header"></div>
  <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
    <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
      <div>
        <h1 class="text-3xl md:text-4xl font-bold">History</h1>
        <p class="text-sm mt-1" style="color:var(--muted)">All analyses stored locally in your browser.</p>
      </div>
      <button id="hist-clear" class="btn btn-ghost text-sm" style="color:#FCA5A5">Clear all</button>
    </div>
    <div class="card p-4 mb-4 flex flex-col sm:flex-row gap-2">
      <input id="hist-search" type="text" placeholder="Search..." class="flex-1" />
      <select id="hist-filter" class="sm:w-48">
        <option value="all">All levels</option>
        <option>Safe</option><option>Low Risk</option><option>Suspicious</option><option>High Risk</option><option>Critical</option>
      </select>
    </div>
    <div id="hist-list" class="space-y-3"></div>
  </main>
  <div id="site-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/report.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
